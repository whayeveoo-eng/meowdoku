<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f6f0e8" />
    <title>Meowdoku · 喵咪安家</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      :root {
        --bg: #f6f0e8;
        --ink: #6e5a64;
        --ink-soft: #9a8a90;
        --accent: #ec9389;
        --card: #ffffff;
        --shadow: 0 3px 10px rgba(150, 120, 140, 0.18);
        --shadow-lg: 0 16px 38px rgba(120, 90, 110, 0.28);
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Baloo 2", "PingFang SC", system-ui, -apple-system, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      body { display: flex; justify-content: center; align-items: flex-start; }
      #md-app {
        width: 100%;
        max-width: 480px;
        padding: 8px 14px calc(10px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .md-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .md-title { font-size: 21px; font-weight: 800; color: #9a7d96; letter-spacing: 0.2px; white-space: nowrap; }
      .md-title span { color: var(--accent); }
      .md-hud { display: flex; gap: 5px; font-size: 13px; font-weight: 700; }
      .md-chip {
        background: var(--card);
        border: none;
        border-radius: 12px;
        padding: 5px 9px;
        text-align: center;
        white-space: nowrap;
        color: var(--ink);
        box-shadow: var(--shadow);
      }
      .md-chip.bad { color: var(--accent); }

      /* 关卡头 */
      .md-levelbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: var(--card);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 7px 12px;
      }
      .md-level-info { font-size: 15px; font-weight: 700; color: var(--ink); }
      .md-level-info b { color: var(--accent); }
      .md-stars { color: #e0a92e; letter-spacing: 1px; }
      .md-stars[data-stars="4"], .md-stars[data-stars="5"] { color: #d6432f; }
      .md-levels-btn {
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-size: 13.5px;
        padding: 7px 12px;
        cursor: pointer;
        flex: 0 0 auto;
      }
      .md-levels-btn:active { transform: scale(0.95); }
      .md-levelbar-btns { display: flex; gap: 6px; flex: 0 0 auto; }
      .md-iconbtn {
        border: none;
        border-radius: 12px;
        background: #bfa2dc;
        color: #fff;
        font-size: 15px;
        padding: 7px 10px;
        cursor: pointer;
      }
      .md-iconbtn:active { transform: scale(0.95); }
      /* 能力档案 */
      .md-abrow { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
      .md-abname { width: 92px; text-align: left; font-size: 13px; font-weight: 700; color: var(--ink); }
      .md-abbar { flex: 1; height: 10px; background: #ece6e0; border-radius: 999px; overflow: hidden; }
      .md-abfill { height: 100%; border-radius: 999px; background: #a8d488; transition: width 0.3s; }
      .md-abpct { width: 88px; text-align: right; font-size: 11.5px; color: var(--ink-soft); }
      .md-rank { font-size: 20px; font-weight: 800; color: #9a7d96; margin: 2px 0 10px; }
      /* 练习三选 */
      .md-pick {
        display: flex; align-items: center; justify-content: space-between;
        width: 100%; border: none; border-radius: 14px; background: #f3ede8;
        padding: 11px 14px; margin: 8px 0; cursor: pointer;
      }
      .md-pick:active { transform: scale(0.97); }
      .md-pick.rec { background: #ffe2ad; outline: 2px solid #f4a259; }
      .md-pick-l { font-weight: 800; font-size: 15px; color: var(--ink); display: flex; align-items: center; }
      .md-pick-r { font-size: 12px; color: var(--ink-soft); text-align: right; }
      .md-rec-tag { font-size: 10.5px; color: #fff; background: #ec9389; border-radius: 999px; padding: 1px 7px; margin-left: 6px; }

      /* 选关网格 */
      .md-levels-card {
        background: var(--card);
        border-radius: 22px;
        padding: 18px 16px 16px;
        width: 100%;
        max-width: 360px;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-lg);
        animation: pop 0.25s ease;
      }
      .md-levels-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      .md-levels-head h3 { margin: 0; font-size: 18px; color: #9a7d96; }
      .md-levels-count { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
      #md-levelgrid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        overflow-y: auto;
        padding: 2px;
      }
      .md-lvl {
        position: relative;
        min-height: 54px;
        border: none;
        border-radius: 12px;
        background: #f3ede8;
        color: var(--ink);
        cursor: pointer;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        padding: 5px 2px;
      }
      .md-lvl-no { font-weight: 800; font-size: 15px; line-height: 1.05; }
      .md-lvl-sz { font-size: 9.5px; font-weight: 700; color: var(--ink-soft); }
      .md-lvl-st { font-size: 9px; line-height: 1; color: #e0a92e; letter-spacing: 0.3px; }
      .md-lvl-st[data-stars="4"], .md-lvl-st[data-stars="5"] { color: #d6432f; }
      .md-lvl:active { transform: scale(0.92); }
      .md-lvl.current { outline: 3px solid var(--accent); }
      .md-lvl.done { background: #a8d488; }
      .md-lvl.done .md-lvl-no { color: #fff; }
      .md-lvl.done .md-lvl-sz { color: #effbe6; }
      .md-lvl.done .md-lvl-st { color: #fff; }
      .md-lvl.locked { background: #ece7e1; box-shadow: none; cursor: default; opacity: 0.6; }
      .md-lvl.locked::after { content: '🔒'; position: absolute; top: 2px; right: 4px; font-size: 10px; }
      .md-levels-foot { display: flex; gap: 8px; margin-top: 12px; }
      .md-levels-foot button {
        flex: 1;
        border: none;
        border-radius: 14px;
        font-weight: 700;
        font-size: 15px;
        padding: 10px;
        cursor: pointer;
      }
      .md-levels-unlock { background: #ffe2ad; color: #b07d4e; }
      .md-levels-close { background: #ece6f0; color: #8c7e94; }
      .md-levels-foot button:active { transform: scale(0.97); }

      /* 棋盘按高度上限收缩，保证下方工具栏始终可见（预留约 300px 给其它行 + 浏览器栏）。 */
      .md-board-wrap {
        position: relative;
        width: min(100%, calc(100dvh - 300px));
        margin: 0 auto;
        aspect-ratio: 1 / 1;
      }
      #md-board { width: 100%; height: 100%; display: block; touch-action: none; }

      .md-rules { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
      .md-rule {
        background: #ece6f0;
        color: #8c7e94;
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 12px;
        font-weight: 700;
      }

      .md-mascot-row { display: flex; align-items: center; gap: 8px; min-height: 24px; }
      #md-mascot { font-size: 23px; }
      #md-bubble {
        background: var(--card);
        border: none;
        border-radius: 14px;
        padding: 5px 13px;
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.2s, transform 0.2s;
      }
      #md-bubble.show { opacity: 1; transform: translateY(0); }
      .md-sound {
        margin-left: auto;
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 999px;
        background: var(--card);
        box-shadow: var(--shadow);
        font-size: 17px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .md-sound:active { transform: scale(0.92); }
      .md-sound.off { opacity: 0.55; }

      .md-tip { font-size: 11.5px; color: var(--ink-soft); text-align: center; line-height: 1.45; }
      .md-tip b { color: #9a7d96; }

      .md-tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
      .md-tools button {
        padding: 9px 4px;
        border: none;
        border-radius: 14px;
        background: var(--card);
        color: var(--ink-soft);
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        box-shadow: var(--shadow);
        transition: transform 0.06s, background 0.12s, color 0.12s;
      }
      .md-tools button:active { transform: scale(0.94); }
      .md-tools .md-ico { font-size: 18px; line-height: 1; }
      .md-tools button.active { background: var(--accent); color: #fff; }
      .md-tools button.off { opacity: 0.55; }

      .md-modal {
        position: fixed;
        inset: 0;
        background: rgba(110, 90, 100, 0.42);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 10;
      }
      .md-modal.show { display: flex; }
      .md-card {
        background: var(--card);
        border-radius: 26px;
        padding: 28px 26px;
        text-align: center;
        max-width: 320px;
        width: 100%;
        box-shadow: var(--shadow-lg);
        animation: pop 0.3s ease;
      }
      @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .md-card .md-cat { font-size: 56px; }
      .md-card h2 { margin: 6px 0 2px; color: var(--accent); font-size: 28px; }
      .md-card .md-big { font-size: 34px; font-weight: 800; color: var(--ink); margin: 8px 0 2px; }
      .md-card .md-sub { color: var(--ink-soft); font-size: 14px; font-weight: 600; }
      .md-card button {
        margin-top: 18px;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 16px;
        background: var(--accent);
        color: #fff;
        font-size: 17px;
        font-weight: 800;
        cursor: pointer;
      }
      .md-card button:active { transform: scale(0.97); }
      .md-card button.md-ghost {
        margin-top: 10px;
        background: transparent;
        color: var(--ink-soft);
        font-size: 15px;
        font-weight: 700;
      }

      /* 开始界面 / 主菜单（开机先显示，盖住 #md-app；低于弹层 z-index:10 故选关/练习等叠在其上） */
      .md-home {
        position: fixed;
        inset: 0;
        z-index: 9;
        background: var(--bg);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px calc(20px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
      }
      .md-home.show { display: flex; animation: pop 0.3s ease; }
      .md-home-inner {
        width: 100%;
        max-width: 320px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 11px;
        text-align: center;
      }
      .md-home-cat { font-size: 62px; line-height: 1; margin-bottom: 2px; }
      .md-home-title { font-size: 34px; font-weight: 800; color: #9a7d96; letter-spacing: 0.3px; }
      .md-home-title span { color: var(--accent); }
      .md-home-sub { font-size: 14px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; }
      .md-home-btn {
        border: none;
        border-radius: 18px;
        background: var(--accent);
        color: #fff;
        font-size: 18px;
        font-weight: 800;
        padding: 15px;
        cursor: pointer;
        box-shadow: var(--shadow);
      }
      .md-home-btn:active { transform: scale(0.97); }
      .md-home-btn.sub { background: var(--card); color: var(--ink); font-size: 16px; padding: 13px; }
      .md-home-row { display: flex; gap: 10px; margin-top: 2px; }
      .md-home-row button {
        flex: 1;
        border: none;
        border-radius: 16px;
        background: #ece6f0;
        color: #8c7e94;
        font-size: 14px;
        font-weight: 700;
        padding: 11px 6px;
        cursor: pointer;
      }
      .md-home-row button:active { transform: scale(0.96); }
      .md-home-ver { font-size: 11.5px; color: var(--ink-soft); margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="md-home show" id="md-home">
      <div class="md-home-inner">
        <div class="md-home-cat">🐱</div>
        <div class="md-home-title">Meow<span>doku</span> 🐾</div>
        <div class="md-home-sub">喵咪安家 · 逻辑解谜</div>
        <button class="md-home-btn" id="md-home-start">▶ 开始 · 第 1 关</button>
        <button class="md-home-btn sub" id="md-home-levels">📋 选关</button>
        <button class="md-home-btn sub" id="md-home-practice">🎯 练习模式</button>
        <div class="md-home-row">
          <button id="md-home-ability">📊 能力档案</button>
          <button id="md-home-sound">🔊 声音</button>
        </div>
        <div class="md-home-ver">v0.8.2</div>
      </div>
    </div>

    <div id="md-app">
      <div class="md-top">
        <div class="md-title">Meow<span>doku</span> 🐾</div>
        <div class="md-hud">
          <div class="md-chip" id="md-cats">🐱 0/8</div>
          <div class="md-chip" id="md-timer">00:00</div>
          <div class="md-chip" id="md-hp">❤️❤️❤️</div>
        </div>
      </div>

      <div class="md-levelbar">
        <span class="md-level-info" id="md-level-info">第 <b>1</b> 关 · 5×5 · <span class="md-stars">★☆☆☆☆</span></span>
        <div class="md-levelbar-btns">
          <button class="md-iconbtn" id="md-home-btn" title="主页" style="background:#8ec3b0">🏠</button>
          <button class="md-iconbtn" id="md-practice-btn" title="为你推荐(练习)" style="background:#ec9389">🎯</button>
          <button class="md-iconbtn" id="md-ability-btn" title="能力档案">📊</button>
          <button class="md-levels-btn" id="md-levels-btn">📋 关卡</button>
        </div>
      </div>

      <div class="md-rules">
        <span class="md-rule">一种颜色一只猫</span>
        <span class="md-rule">同行同列各一只</span>
        <span class="md-rule">猫咪不能相邻</span>
      </div>

      <div class="md-board-wrap">
        <canvas id="md-board" width="900" height="900"></canvas>
      </div>

      <div class="md-mascot-row">
        <div id="md-mascot">🐱</div>
        <div id="md-bubble">给每只猫找个位子喵~</div>
        <button id="md-sound" class="md-sound" title="声音开关">🔊</button>
      </div>

      <div class="md-tip">
        点格子循环：<b>空 → ✕ → 🐱 → 空</b> · 放错猫 <b>扣 1 ❤️</b>（每关 3 ❤️）
      </div>

      <div class="md-tools">
        <button id="md-auto"><span class="md-ico">✕</span>自动叉</button>
        <button id="md-undo"><span class="md-ico">↩️</span>撤销</button>
        <button id="md-clear"><span class="md-ico">🧹</span>清空</button>
        <button id="md-hint"><span class="md-ico">💡</span>提示</button>
        <button id="md-restart"><span class="md-ico">🔄</span>重开</button>
      </div>
    </div>

    <div class="md-modal" id="md-win">
      <div class="md-card">
        <div class="md-cat">😻</div>
        <h2 id="md-win-title">安家成功喵！</h2>
        <div class="md-big" id="md-win-time">00:00</div>
        <div class="md-sub" id="md-win-stats"></div>
        <div class="md-sub" id="md-win-rank" style="margin-top:6px;color:#9a7d96;font-weight:700"></div>
        <button id="md-next">下一关 ▶</button>
        <button id="md-win-levels" class="md-ghost">选关</button>
      </div>
    </div>

    <div class="md-modal" id="md-ability">
      <div class="md-card" style="max-width:340px">
        <div class="md-cat" style="font-size:40px">📊</div>
        <h2 style="font-size:22px;color:#9a7d96">能力档案</h2>
        <div id="md-ability-body"></div>
        <button id="md-ability-close" class="md-ghost">关闭</button>
      </div>
    </div>

    <div class="md-modal" id="md-practice">
      <div class="md-card" style="max-width:340px">
        <div class="md-cat" style="font-size:40px">🎯</div>
        <h2 style="font-size:22px;color:#9a7d96">为你推荐</h2>
        <div class="md-sub" style="margin-bottom:4px">挑一档练习（不计战役进度）</div>
        <div id="md-practice-body"></div>
        <button id="md-practice-close" class="md-ghost">取消</button>
      </div>
    </div>

    <div class="md-modal" id="md-fail">
      <div class="md-card">
        <div class="md-cat">🙀</div>
        <h2 style="color:#d6432f">喵呜…没血了</h2>
        <div class="md-sub" id="md-fail-stats"></div>
        <button id="md-fail-retry">再试一次 🐾</button>
        <button id="md-fail-levels" class="md-ghost">选关</button>
      </div>
    </div>

    <div class="md-modal" id="md-levels">
      <div class="md-levels-card">
        <div class="md-levels-head">
          <h3>选关</h3>
          <span class="md-levels-count" id="md-levels-count">已通关 0 / 100</span>
        </div>
        <div id="md-levelgrid"></div>
        <div class="md-levels-foot">
          <button class="md-levels-unlock" id="md-unlock-all">🔓 解锁全部</button>
          <button class="md-levels-close" id="md-levels-close">关闭</button>
        </div>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
